# Paseo workstation (Komodo stack "paseo" on ms-s1; the deployed copy is tracked in
# the ms-s1 repo as stacks/paseo/compose.yaml, with variable names in env.example).
# Image: https://github.com/RealBeepMcJeep/paseo-workstation, rebuilt and
# self-tested by GitHub Actions whenever an upstream version changes.
#
# Update:   Komodo "Deploy" (pull + recreate). Recreating ends running agent
#           sessions; their history is kept in the home dataset.
# Rollback: set PASEO_IMAGE_TAG in .env to an older dated tag (YYYYMMDD-HHMMSS),
#           then Deploy. sha-<commit> tags only name the source commit and are
#           reused by scheduled rebuilds. Restore home/workspace from a snapshot
#           if a newer agent migrated its data.
#
# .env: PASEO_PASSWORD (required); GITEA_URL, GITEA_USER, GITEA_TOKEN;
# MCPHUB_KEY, MCP_HOMELAB_URL (MCPHub); GH_TOKEN, GIT_USER_NAME,
# GIT_USER_EMAIL, PASEO_MEM_LIMIT, PASEO_IMAGE_TAG; proxy: PROXY_DOMAIN,
# PROXY_LAN_DOMAIN, PROXY_BIND, CLOUDFLARE_API_TOKEN, PROXY_MANAGE_DNS.
services:
  paseo:
    image: ghcr.io/realbeepmcjeep/paseo-workstation:${PASEO_IMAGE_TAG:-latest}
    container_name: paseo
    hostname: paseo
    user: 568:568
    restart: unless-stopped
    # Room for the optional shutdown hook (75s) plus proxy and Paseo shutdown.
    stop_grace_period: 120s
    # Chromium uses /dev/shm.
    shm_size: 1gb
    environment:
      TZ: America/Phoenix
      PASEO_PASSWORD: ${PASEO_PASSWORD:?Set PASEO_PASSWORD in .env}
      # app.paseo.sh and Android connect through the outbound relay; no ports.
      PASEO_RELAY_ENABLED: "true"
      GIT_USER_NAME: ${GIT_USER_NAME:-paseo}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-paseo@nobody.com}
      GH_TOKEN: ${GH_TOKEN:-}
      GITEA_URL: ${GITEA_URL:-}
      GITEA_USER: ${GITEA_USER:-paseo}
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      # Agents get an mcphub entry only when MCPHUB_KEY is set.
      MCP_HOMELAB_URL: ${MCP_HOMELAB_URL:-}
      MCPHUB_TOKEN: ${MCPHUB_KEY:-}
      # Optional subdomain proxy (see README): off unless a domain is set.
      PROXY_DOMAIN: ${PROXY_DOMAIN:-}
      PROXY_LAN_DOMAIN: ${PROXY_LAN_DOMAIN:-}
      PROXY_BIND: ${PROXY_BIND:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      # true: create missing *.<host> DNS records for <service>.<host> sites.
      PROXY_MANAGE_DNS: ${PROXY_MANAGE_DNS:-}
    volumes:
      # rslave: new ZFS snapshots appear under .zfs/snapshot without a restart.
      - type: bind
        source: /srv/paseo/home
        target: /home/paseo
        bind:
          create_host_path: false
          propagation: rslave
      - type: bind
        source: /srv/paseo/workspace
        target: /workspace
        bind:
          create_host_path: false
          propagation: rslave
      # Tiers without snapshots: /scratch may be wiped any time; /bulk holds large files.
      - type: bind
        source: /srv/scratch/paseo
        target: /scratch
        bind:
          create_host_path: false
      - type: bind
        source: /srv/bulk/paseo
        target: /bulk
        bind:
          create_host_path: false
      # TEMPORARY bind mounts: old paths keep working until rec and modhub switch to
      # /scratch/rec/builds and /bulk/modhub/recordings (see the handoffs), then delete.
      - type: bind
        source: /srv/scratch/paseo/rec/builds
        target: /workspace/rec/artifacts/builds
        bind:
          create_host_path: false
      - type: bind
        source: /srv/bulk/paseo/modhub/recordings
        target: /workspace/modhub/moderation-hub/data/recordings/media
        bind:
          create_host_path: false
      # modhub's capture spool (hard-coded .runtime/media) also lives on /bulk, so capture
      # churn stays out of snapshots. Until modhub makes both paths configurable, the
      # spool-to-media hard link is a copy (separate mounts); see the modhub handoff.
      - type: bind
        source: /srv/bulk/paseo/modhub/spool
        target: /workspace/modhub/moderation-hub/.runtime/media
        bind:
          create_host_path: false
    # macvlan gives Paseo its own LAN IP (agents can serve ad-hoc ports to the
    # LAN, and the proxy's wildcard DNS points here). Other hosts' services are
    # reached by their DNS names.
    networks:
      lan_macvlan:
        ipv4_address: 192.168.87.49
    dns:
      - 192.168.86.11
      - 192.168.86.12
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          # A cap, not a reservation. 12g saw OOM kills with several agents,
          # language servers, Chromium and project services. The agents
          # container itself is capped at 64 GiB.
          memory: ${PASEO_MEM_LIMIT:-48g}
          # The agents share one cgroup: bound runaway process trees. (Must
          # live here: Compose rejects pids_limit next to deploy limits.)
          pids: 4096
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  lan_macvlan:
    external: true
