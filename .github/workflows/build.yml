# Probe upstream versions every 6 hours; build, self-test and publish the image
# only when something changed. The repo is pushed here by a one-way Gitea push
# mirror, so this workflow never writes to the repository.
#
# "Changed" = the hash of scripts/probe-versions.sh output plus every tracked
# build input (Dockerfile, rootfs/, .dockerignore, the probe script and this
# workflow) differs from the fingerprint label on :latest. The probe output
# includes the ISO week, so Debian updates are picked up at least weekly.
#
# Tags: :latest, :YYYYMMDD-HHMMSS and :sha-<commit>. Roll back with dated tags:
# scheduled rebuilds of one commit reuse its sha- tag. Nothing is pushed unless
# the build checks and self-test pass. Pushes to other branches (pull requests,
# mirrored from Gitea) always build and self-test, but never publish.
name: Build image

on:
  push:
    branches: ["**"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if nothing changed
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  actions: write # re-enable this workflow so the schedule never lapses

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      image: ${{ steps.decide.outputs.image }}
      fingerprint: ${{ steps.decide.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling through the API resets that without a commit,
      # which a push-mirrored repository cannot accept.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"

      - name: Probe upstream versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/probe-versions.sh | tee versions.env

      - name: Compare with the published image
        id: decide
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          fingerprint="$( { cat versions.env; git ls-files -s Dockerfile rootfs .dockerignore \
            scripts/probe-versions.sh .github/workflows/build.yml; } | sha256sum | cut -d' ' -f1)"
          labels="$(skopeo inspect --creds "${{ github.actor }}:${{ github.token }}" \
            --format '{{json .Labels}}' "docker://$image:latest" 2>/dev/null || echo '{}')"
          published="$(jq -r '."io.paseo-workstation.fingerprint" // ""' <<< "$labels")"
          jq -r '."io.paseo-workstation.inputs" // ""' <<< "$labels" | tr ' ' '\n' | sed '/^$/d' > published.env

          build=true
          publish=true
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            publish=false # branch/PR validation: always build and test, never publish
          elif [ "$published" = "$fingerprint" ] && [ "$FORCE" != true ]; then
            build=false
          fi
          {
            echo "image=$image"
            echo "fingerprint=$fingerprint"
            echo "build=$build"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          {
            if [ "$publish" = false ]; then echo "### Branch build: test only, nothing will be published"
            elif [ "$build" = true ]; then echo "### Building a new image"
            else echo "### Up to date: nothing to build"; fi
            echo '```diff'
            diff -u published.env versions.env | tail -n +3 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.env

  build:
    needs: probe
    if: needs.probe.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ${{ needs.probe.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: versions

      # The image is several GB; drop preinstalled SDKs the build never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build arguments
        id: args
        run: |
          {
            echo 'list<<EOF'
            cat versions.env
            echo "BUILD_INPUTS=$(tr '\n' ' ' < versions.env)"
            echo EOF
            echo "inputs=$(tr '\n' ' ' < versions.env)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=sha,format=short,prefix=sha-
          labels: |
            io.paseo-workstation.fingerprint=${{ needs.probe.outputs.fingerprint }}
            io.paseo-workstation.inputs=${{ steps.args.outputs.inputs }}

      # Build into the local Docker engine first; push only after the self-test.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.list }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      # Fixtures: a LAN-only proxy, an autostart hook that starts an upstream
      # server, a site file for it, a static folder (with a dotfile that must
      # stay hidden), a symlink that must be rejected, and a shutdown hook.
      - name: Self-test a running container
        run: |
          set -Eeuo pipefail
          # Failures are reported as annotations too (readable without signing in).
          annotate() { local text; text="$(cat)"; text="${text//'%'/'%25'}"; echo "::error title=$1::${text//$'\n'/'%0A'}"; }
          trap 'rc=$?; trap - ERR; { echo "command: $BASH_COMMAND (exit $rc)"; docker logs smoke 2>&1 | grep -v "^{" | tail -n 30; } 2>&1 | annotate selftest-step' ERR
          mkdir -p /tmp/smoke/home/.config/workstation /tmp/smoke/workspace/proxy/sites \
            /tmp/smoke/workspace/proxy/www/hello /tmp/smoke/workspace/upstream
          cat > /tmp/smoke/home/.config/workstation/autostart <<'EOF'
          #!/bin/sh
          echo upstream-ok > /workspace/upstream/marker.txt
          cd /workspace/upstream && nohup python3 -m http.server 18999 --bind 127.0.0.1 > /dev/null 2>&1 &
          # A fake Gitea that only comes up now, after workstation-start's first tea
          # login attempt: the same race as GITEA_URL served by the container's own proxy.
          nohup python3 /workspace/upstream/fake_gitea.py > /dev/null 2>&1 &
          touch "$HOME/autostart-ran"
          EOF
          cat > /tmp/smoke/workspace/upstream/fake_gitea.py <<'EOF'
          import http.server, json
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = {"/api/v1/version": {"version": "1.24.0"}, "/api/v1/user": {"id": 1, "login": "ci"}}.get(self.path.split("?")[0])
                  self.send_response(200 if body else 404)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(json.dumps(body or {"message": "not found"}).encode())
              def log_message(self, *args):
                  pass
          http.server.HTTPServer(("127.0.0.1", 18998), Handler).serve_forever()
          EOF
          cat > /tmp/smoke/home/.config/workstation/shutdown <<'EOF'
          #!/bin/sh
          touch "$HOME/shutdown-ran"
          EOF
          chmod 755 /tmp/smoke/home/.config/workstation/*
          printf '# check: /marker.txt\nimport proxy upstream 127.0.0.1:18999\n' > /tmp/smoke/workspace/proxy/sites/upstream.caddy
          printf '# check: /\nimport proxy down 127.0.0.1:1\n' > /tmp/smoke/workspace/proxy/sites/down.caddy
          echo 'import proxy hello.demo 127.0.0.1:18999' > /tmp/smoke/workspace/proxy/sites/hello.demo.caddy
          mkdir -p /tmp/smoke/workspace/proxy/tcp
          printf '# check: tcp\nimport forward 18080 127.0.0.1:18999\n' > /tmp/smoke/workspace/proxy/tcp/echo.caddy
          echo '<p>hello static</p>' > /tmp/smoke/workspace/proxy/www/hello/index.html
          echo 'SECRET=1' > /tmp/smoke/workspace/proxy/www/hello/.env
          ln -s /etc /tmp/smoke/workspace/proxy/www/escape
          sudo chown -R 568:568 /tmp/smoke
          docker run -d --name smoke --user 568:568 --shm-size 1g --security-opt no-new-privileges:true \
            -e PASEO_PASSWORD=ci-self-test -e PASEO_RELAY_ENABLED=false -e PROXY_LAN_DOMAIN=selftest.lan -e PROXY_CHECK_INTERVAL=60 \
            -e GITEA_URL=http://127.0.0.1:18998 -e GITEA_TOKEN=ci-dummy \
            -v /tmp/smoke/home:/home/paseo -v /tmp/smoke/workspace:/workspace \
            "$IMAGE:latest"
          for _ in $(seq 1 60); do
            state="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            [ "$state" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || break
            sleep 5
          done
          docker logs smoke 2>&1 | tail -n 40
          if [ "$state" != healthy ]; then
            docker logs smoke 2>&1 | tail -n 40 | annotate unhealthy
            exit 1
          fi
          docker exec smoke cat /home/paseo/.paseo/workstation-startup-warnings.txt
          for _ in $(seq 1 30); do docker exec smoke workstation-proxy status > /dev/null && break; sleep 1; done
          if ! docker exec smoke workstation-selftest 2>&1 | tee selftest.log; then
            trap - ERR
            { grep -A 15 '^FAIL' selftest.log || tail -n 20 selftest.log; echo '--- workstation-proxy status';
              docker exec smoke workstation-proxy status || true; echo '--- container log (non-JSON lines)';
              docker logs smoke 2>&1 | grep -v '^{' | tail -n 25; } 2>&1 | head -n 90 | annotate selftest
            exit 1
          fi

      - name: Proxy fixtures, autostart and a graceful stop
        run: |
          set -euo pipefail
          get() { docker exec smoke curl -s -o /dev/null -w '%{http_code}' --resolve "$1.selftest.lan:80:127.0.0.1" "http://$1.selftest.lan$2"; }
          docker exec smoke workstation-proxy sites
          test -f /tmp/smoke/home/autostart-ran || { echo "::error::autostart hook did not run"; exit 1; }
          trap 'docker logs smoke 2>&1 | tail -n 30 | sed "s/^/  /"' ERR
          [ "$(get upstream /marker.txt)" = 200 ] || { echo "::error::proxy to the autostarted upstream failed"; exit 1; }
          [ "$(docker exec smoke curl -s -m 5 http://127.0.0.1:18080/marker.txt)" = upstream-ok ] \
            || { echo "::error::TCP forward to the autostarted upstream failed"; exit 1; }
          docker exec smoke workstation-proxy sites | grep -E '^echo +tcp'
          # <service>.<host> sites: the site works, unknown services on that host get the
          # 404 page, and a public domain would get one wildcard certificate per host.
          [ "$(get hello.demo /marker.txt)" = 200 ] || { echo "::error::<service>.<host> site failed"; exit 1; }
          [ "$(get nothing.demo /)" = 404 ] || { echo "::error::unknown service on a host did not 404"; exit 1; }
          docker exec -e PROXY_DOMAIN=example.com -e CLOUDFLARE_API_TOKEN=ci-dummy -e XDG_STATE_HOME=/tmp/ci-show \
            smoke workstation-proxy show | grep -F '*.demo.example.com {' \
            || { echo "::error::no per-host wildcard block in the generated config"; exit 1; }
          [ "$(get hello /)" = 200 ] || { echo "::error::static folder not served"; exit 1; }
          [ "$(get hello /.env)" = 404 ] || { echo "::error::dotfile was served"; exit 1; }
          [ "$(get escape /passwd)" = 404 ] || { echo "::error::rejected symlink was served"; exit 1; }
          docker exec smoke workstation-proxy sites | grep -E '^escape +skipped'
          # tea: the first login attempt fails (fake Gitea not up yet); the background retry adds it.
          for _ in $(seq 1 30); do docker exec smoke tea logins list 2> /dev/null | grep -q '127.0.0.1:18998' && break; sleep 2; done
          docker exec smoke tea logins list | grep -q '127.0.0.1:18998' || { echo "::error::tea login was not added on retry"; exit 1; }
          docker exec smoke cat /home/paseo/.paseo/workstation-startup-warnings.txt
          docker exec smoke grep -q 'retrying in the background' /home/paseo/.paseo/workstation-startup-warnings.txt \
            || { echo "::error::the first tea login attempt did not hit the race (test fixture problem)"; exit 1; }
          docker exec smoke grep -q 'login added on retry' /home/paseo/.paseo/workstation-startup-warnings.txt \
            || { echo "::error::tea retry did not record success"; exit 1; }
          # Status checks: up, down, none (no check line) and the implicit static check.
          # (Interval 60s: a result from before the upstream started is retried within it.)
          for _ in $(seq 1 45); do
            checks=$(docker exec smoke workstation-proxy checks)
            grep -Eq '^up +site +upstream' <<< "$checks" && break
            sleep 2
          done
          echo "$checks"
          grep -Eq '^up +site +upstream ' <<< "$checks" || { echo "::error::upstream status check is not up"; exit 1; }
          grep -Eq '^down +site +down ' <<< "$checks" || { echo "::error::down status check is not down"; exit 1; }
          grep -Eq '^none +site +hello.demo ' <<< "$checks" || { echo "::error::site without a check is not none"; exit 1; }
          grep -Eq '^up +static +hello ' <<< "$checks" || { echo "::error::static folder check is not up"; exit 1; }
          grep -Eq '^up +tcp +echo ' <<< "$checks" || { echo "::error::tcp status check is not up"; exit 1; }
          docker exec smoke curl -fsS --resolve sites.selftest.lan:80:127.0.0.1 http://sites.selftest.lan/status.json \
            | jq -e '.checks["site:upstream"].state == "up"' > /dev/null \
            || { echo "::error::status.json is not served on the sites page"; exit 1; }
          start=$SECONDS
          docker stop -t 120 smoke
          took=$((SECONDS - start))
          echo "stopped in ${took}s, exit code $(docker inspect -f '{{.State.ExitCode}}' smoke)"
          docker logs smoke 2>&1 | grep 'workstation-supervise' | tail -n 5
          test -f /tmp/smoke/home/shutdown-ran || { echo "::error::shutdown hook did not run"; exit 1; }
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0 ] || { echo "::error::unclean exit code"; exit 1; }
          [ "$took" -lt 100 ] || { echo "::error::stop took too long"; exit 1; }

      - name: Publish
        if: needs.probe.outputs.publish == 'true'
        run: |
          set -euo pipefail
          while read -r tag; do docker push "$tag"; done <<< "${{ steps.meta.outputs.tags }}"
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: $(docker image inspect --format '{{join .RepoDigests " "}}' "$IMAGE:latest")"
            echo '```'
            echo '```'
            docker run --rm --entrypoint cat "$IMAGE:latest" /etc/paseo-workstation/versions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
